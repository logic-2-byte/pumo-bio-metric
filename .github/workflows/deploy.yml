name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: logic2byte/pumo-biometric-server:latest
          # No build-args.
          #
          # Configuration reaches the container at RUN time, from the .env
          # the deploy job writes.


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: env
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/pumo-biometric-server/"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        env:
          ENV_CONTENT: ${{ secrets.ENV || vars.ENV }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_CONTENT
          script: |
            mkdir -p ~/pumo-biometric-server
            cd ~/pumo-biometric-server

            echo "Updating docker-compose.yml..."
            if [ -f "docker-compose.prod.yml" ]; then
              mv docker-compose.prod.yml docker-compose.yml
            fi

            echo "Creating .env file..."
            echo "$ENV_CONTENT" > .env
            chmod 600 .env

            # The two bind-mounted directories, created here rather than by
            # Docker.
            #
            # A bind mount whose host path does not exist is created by the
            # daemon as root:root. The image runs as the unprivileged
            # `biometric` user (uid 10001, see the Dockerfile), so the spool it
            # is supposed to write to would be owned by a user it is not — and
            # the spool is the only copy of a pushed punch between arriving and
            # reaching the LMS. It fails at the first punch, not at boot, which
            # is the worst time to find out.
            #
            # Numeric ids because the host has no `biometric` user; the uid is
            # what the kernel actually checks.
            mkdir -p spool data/logs
            sudo chown -R 10001:10001 spool data/logs 2>/dev/null \
              || chown -R 10001:10001 spool data/logs

            # Detect whether VM uses modern 'docker compose' or legacy 'docker-compose'
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Error: Neither 'docker compose' nor 'docker-compose' found on the host."
              exit 1
            fi

            echo "Pulling latest Docker image..."
            $DC pull

            echo "Starting services..."
            $DC up -d --force-recreate

            # Verify, rather than trusting `up -d` to mean "running".
            #
            # `up -d` returns 0 for a container that started and then died —
            # which is exactly what happened on the release that prompted this
            # step: gunicorn exited 3 within seconds, the job went green, and
            # nobody knew the bridge was down until attendance stopped
            # appearing in the console.
            echo "Waiting for the service to answer..."
            for _ in $(seq 1 20); do
              if $DC exec -T app python -c \
                   "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/pulse', timeout=5).status==200 else 1)" \
                   >/dev/null 2>&1; then
                echo "Biometric bridge is up."
                exit 0
              fi
              sleep 5
            done

            echo "::error::The biometric bridge did not answer within 100s."
            $DC ps
            $DC logs --tail=200 app
            exit 1

