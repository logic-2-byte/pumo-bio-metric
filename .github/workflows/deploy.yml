name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: logic2byte/pumo-biometric-server:latest
          # No build-args.
          #
          # Configuration reaches the container at RUN time, from the .env
          # the deploy job writes.


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: env
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/pumo-biometric-server/"

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        env:
          ENV_CONTENT: ${{ secrets.ENV || vars.ENV }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_CONTENT
          script: |
            mkdir -p ~/pumo-biometric-server
            cd ~/pumo-biometric-server

            echo "Updating docker-compose.yml..."
            if [ -f "docker-compose.prod.yml" ]; then
              mv docker-compose.prod.yml docker-compose.yml
            fi

            echo "Creating .env file..."
            echo "$ENV_CONTENT" > .env
            chmod 600 .env

            # Detect whether VM uses modern 'docker compose' or legacy 'docker-compose'
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Error: Neither 'docker compose' nor 'docker-compose' found on the host."
              exit 1
            fi

            echo "Pulling latest Docker image..."
            $DC pull

            echo "Starting services..."
            $DC up -d --force-recreate

