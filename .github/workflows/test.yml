name: Test & Lint
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # No postgres service any more. This service owns no tables — its tests do
    # not touch a database, and the LMS connection belongs to the LMS and is
    # mocked here.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # requirements-dev, not requirements: ruff, mypy and pytest are dev-only
      # and are deliberately absent from the production image. Installing
      # requirements.txt alone would leave ruff missing and this job broken.
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/

      # Was commented out. The suite is small and fast; a test job that runs
      # nothing is worse than no test job, because it reports green.
      - name: Tests
        run: python -m pytest tests/ -q
