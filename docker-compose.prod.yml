# Production.
#
# ONE INSTANCE PER SITE, and do not scale it. See the comment at the top of
# gunicorn_config.py: a second process means a second connection to each
# reader, and these readers accept one at a time.
#
# WHERE THIS CAN RUN, which is not a free choice:
#
#   * Polling (pyzk, TCP 4370) requires this container to reach the readers at
#     their LAN addresses. That works on a branch box. It does NOT work from a
#     cloud VM unless there is a VPN to the branch network.
#   * ADMS/iClock push requires the readers to reach THIS service. That works
#     from a cloud VM only if the branch can route to it.
#
# Deployed to a VM without a VPN, the polling half is inert and only pushed
# punches arrive — which also loses the reader-memory sweep that recovers an
# outage. For the polling bridge, run it at the branch, either with this file
# or with `python -m app.sync.run`.

services:
  app:
    image: logic2byte/pumo-biometric-server:latest
    container_name: pumo-biometric-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env

    # Two networks, and the second one is not optional when the LMS is on this
    # same host.
    #
    # This project deploys to ~/pumo-biometric-server, so compose names it
    # `pumo-biometric-server` and gives it a private `default` bridge. The LMS
    # stack is a SEPARATE compose project (`lms`, in /opt/lms) with its own
    # `internal` bridge, and Docker's embedded DNS does not resolve names
    # across projects. On the default network alone, LMS_DB_HOST=postgres does
    # not resolve to anything — the bridge cannot see the database at all, and
    # every punch it captures goes to the spool and stays there.
    #
    # Joining lms_internal puts this container on the same bridge as the
    # `postgres` service, which is what makes that hostname mean something.
    # The LMS stack publishes no database port, deliberately, so this is also
    # the only route in.
    networks:
      - default
      - lms_internal

    volumes:
      # The spool must outlive the container.
      #
      # It is the only copy of a pushed punch between arriving and reaching the
      # LMS, and the deploy job runs `up -d --force-recreate` on every release.
      # Without this mount that command silently discards any attendance held
      # during an LMS outage.
      - ./spool:/srv/app/spool
      - ./data/logs:/srv/app/data/logs

    logging:
      # This service prints a banner per punch. Unbounded json-file logs have
      # filled small VM disks before.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Created by the LMS stack (/opt/lms/compose.prod.yaml declares `name: lms`
  # and a network called `internal`, which Docker names `lms_internal`).
  #
  # `external: true` means "attach to it, do not create it" — so this file
  # never races the LMS stack for ownership of the network, and `docker
  # compose down` here cannot take the LMS's own bridge with it.
  #
  # It also makes the LMS stack a hard prerequisite: if that network does not
  # exist, `up` fails immediately with a named error instead of starting a
  # container that silently cannot reach the database. Confirm the name with
  # `docker network ls` if the LMS project is ever renamed.
  lms_internal:
    external: true

